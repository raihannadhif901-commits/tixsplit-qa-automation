name: TixSplit QA Automation CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-suite:
    name: Run Automated API & UI Tests
    runs-on: ubuntu-latest

    steps:
      # 1. Unduh kode dari repositori
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      - name: Prepare Config Properties
        run: cp src/test/resources/config.properties.example src/test/resources/config.properties


      - name: Run TestNG Master Suite
        run: mvn clean test -DsuiteXmlFile=testng.xml


      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-execution-reports
          path: target/surefire-reports/